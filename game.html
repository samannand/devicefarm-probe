<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyno probe game</title>
<style>
  html, body { margin: 0; background: #1b1f24; color: #e8e8e8; font: 16px -apple-system, system-ui, sans-serif; }
  canvas { display: block; width: 100%; max-width: 480px; margin: 12px auto; background: #0b0d10; }
  #log { text-align: center; font-size: 22px; }
</style>
</head>
<body>
<canvas id="c" width="480" height="270"></canvas>
<div id="log">starting</div>
<script>
  // A stand-in game with a known memory size, so the WebContent process that runs it is easy to
  // find in the trace (its footprint jumps by about mb), and so a kill can be caused on purpose.
  //   mb     MB to allocate once, `delay` seconds after load, and keep (default 0)
  //   grow   MB to add every `every` ms after that, until iOS kills the tab (default 0: no growth)
  //   every  ms between growth steps (default 250)
  //   delay  seconds before the first allocation (default 5)
  const q = new URLSearchParams(location.search);
  const holdMb = Number(q.get("mb") || 0);
  const growMb = Number(q.get("grow") || 0);
  const every = Number(q.get("every") || 250);
  const delay = Number(q.get("delay") || 5);
  const keep = [];
  let total = 0;
  let seed = 1;

  // Fill each chunk with pseudo-random words: zero or repeated pages would be compressed or never
  // committed, and would not count fully in the footprint.
  function allocate(mb) {
    const words = new Uint32Array(mb * 262144);
    for (let i = 0; i < words.length; i++) {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      words[i] = seed;
    }
    keep.push(words);
    total += mb;
  }

  function show(text) {
    document.getElementById("log").textContent = text;
    document.title = text;
    try { parent.document.title = text; } catch (e) { /* cross-origin parent */ }
  }

  // Keep rendering, like an idle game does.
  const ctx = document.getElementById("c").getContext("2d");
  function frame(t) {
    ctx.fillStyle = "#0b0d10";
    ctx.fillRect(0, 0, 480, 270);
    ctx.save();
    ctx.translate(240, 135);
    ctx.rotate(t / 600);
    ctx.fillStyle = "#3fa7d6";
    ctx.fillRect(-40, -40, 80, 80);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setTimeout(() => {
    for (let left = holdMb; left > 0; left -= 16) allocate(Math.min(16, left));
    show("holding " + total + " MB");
    if (growMb > 0) {
      setInterval(() => {
        allocate(growMb);
        show("holding " + total + " MB, growing");
      }, every);
    }
  }, delay * 1000);
</script>
</body>
</html>
